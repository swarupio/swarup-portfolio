name: Supabase Keep Alive

on:
  schedule:
    # Run every 2 days at midnight UTC
    - cron: '0 0 */2 * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to prevent project pause..."
          curl -s -o /dev/null -w "%{http_code}" https://efpjuonqhumeaunexwyu.supabase.co/rest/v1/
