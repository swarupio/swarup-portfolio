name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI if needed

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Edge Function
        # This securely hits your specific Supabase project to register activity
        run: curl -s "https://efpjuonqhumeaunexwyu.supabase.co/functions/v1/leetcode-calendar" > /dev/null